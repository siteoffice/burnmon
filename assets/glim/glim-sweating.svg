<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><svg class="glim glim-sweating mood-sweating theme-dark" xmlns="http://www.w3.org/2000/svg" viewBox="-66 -6 132 132" x="38" y="38" width="180" height="180"><style>.theme-light{--cord:#888780;--base:#5F5E5A;--feet:#888780;--ray:#EF9F27;--rip:#BA7517;--mitt:#B4B2A9;--zz:#854F0B;--stamp:#0F6E56;--plank:#8A6A3C;--brick:#9a3412;--panel:#FFFFFF}.theme-dark{--cord:#888780;--base:#5F5E5A;--feet:#888780;--ray:#FAC775;--rip:#FAC775;--mitt:#D3D1C7;--zz:#FAC775;--stamp:#5DCAA5;--plank:#A98554;--brick:#c2410c;--panel:#14110D}.cord{stroke:var(--cord);fill:none}.basep{fill:var(--base)}.feet{fill:var(--feet)}.mitt{fill:var(--mitt)}.glim-ray{stroke:var(--ray);fill:none}.rip{stroke:var(--rip);fill:none}.zz{fill:var(--zz);font-weight:600}.drop{fill:#378ADD}.mug rect{fill:var(--mitt)}.mug path{stroke:var(--mitt)}.dot{fill:var(--ray)}.stampi rect{stroke:var(--stamp);fill:var(--panel)}.stampi text{fill:var(--stamp);font-weight:600}.plankp{fill:var(--plank)}.glim-brick{fill:var(--brick)}.wallnote{fill:var(--zz);font-weight:600}.dome{fill:#EF9F27}.mood-off .dome{fill:#888780}.mood-asleep .dome{fill:#854F0B}.mood-your_turn .dome,.mood-blocked .dome{fill:#FAC775}.mood-sweating .dome{fill:#D85A30}.lid{fill:#EF9F27}.mood-off .lid{fill:#888780}.mood-asleep .lid{fill:#854F0B}.mood-your_turn .lid,.mood-blocked .lid{fill:#FAC775}.mood-sweating .lid{fill:#D85A30}.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}.mood-off .lid,.mood-asleep .lid{transform:scaleY(1)}.mood-bored .lid{transform:scaleY(.5)}.arm,.rays,.drop,.zz,.mug,.dots,.stampi,.rip,.brow{opacity:0}.mood-your_turn .arm,.mood-bored .arm{opacity:1}.mood-blocked .rays,.mood-your_turn .rays{opacity:1}.mood-your_turn .glim-ray:not(.r2){opacity:0}.mood-sweating .drop,.mood-asleep .zz,.mood-your_turn .brow{opacity:1}</style><g class="rig"><g class="swing"><g transform="translate(0,4)"><path class="cord" d="M0 -4 V23" stroke-width="2"/><p