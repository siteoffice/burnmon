      function(v) { saveSetting('panel', v); });
    controlsRows();
    rootRow();
    detail({k: 'Settings', t: 'Settings', d: 'Width, menu, horizon and theme are the same in every ZND UI. They and the pull request switch ' +
      'are saved and applied at once. The root is checked first and saved with its own Save.'});
  }

  // rootRow: the Root field with Browse (the native folder picker) and Save. Typing or picking checks the
  // folder and shows how many units it holds; Save is enabled only for a good folder that differs from the
  // root now. Save writes controlcentre.json and every page reads the new root at once. With --root the
  // field is read-only.
  // controlsRows: the four controls the Control Centre presses, switched here (they moved from BurnMon Dev's
  // gear on 2026-11-15; BurnMon Dev keeps Stop). The switches are the same keys in burnmon-dev-view.json. One
  // row with a tick per control, and a line with the reason a ticked control cannot run now.
  function controlsRows() {
    var seq = drawSeq, NAMES = {attach: 'Attach to a session', approve: 'Approve a gate', send_back: 'Send a gate back', close_sprint: 'Close sprint'};
    var r = h('div', 'setrow'), lb = h('span', 'lb', 'Controls');
    lb.appendChild(h('span', 'hp', 'Off until you tick them. Attach needs claude_path and agent_view in burnmon.json; Approve, ' +
      'Send back and Close sprint need python on PATH and foreman_root. Each press shows the exact command first; Confirm runs it.'));
    r.appendChild(lb);
    var box = h('div', 'ctlsw'), line = h('div', 'rootline');
    r.appendChild(box);
    pane.appendChild(r);
    pane.appendChild(line);
    function draw(v) {
      if (seq !== drawSeq) return;
      box.textContent = '';
      var why = [];
      v.ids.forEach(function(id) {
        var l = h('label', null), c = h('input', null);
        c.type = 'checkbox';
        c.checked = !!v.on[id];
        c.onchange = function() {
          Promise.resolve(api.controlSet({id: id, on: c.checked})).then(draw, function(e) { fail('Could not save the switch', e); });
        };
        l.appendChild(c);
        l.appendChild(document.createTextNode(' ' + NAMES[id]));
        box.appendChild(l);
        if (v.on[id] && !v.ready[id] && v.why[id]) why.push(NAMES[id] + ': ' + v.why[id]);
      });
      line.textContent = why.length ? why.join('. ') + '.' : 'Ticked controls are ready.';
      line.classList.toggle('warn', why.length > 0);
    }
    Promise.resolve(api.controls()).then(draw, function(e) { fail('Could not read the controls', e); });
  }

  function rootRow() {
    var seq = drawSeq, cur = '', n = 0, timer = 0;
    var r = h('div', 'setrow'), lb = h('span', 'lb', 'Root');
    lb.appendChild(h('span', 'hp', state.root === '' ? 'Pick the folder to show with Browse, or type it, then Save.' : 'The folder every page reads.'));
    r.appendChild(lb);
    var f = h('div', 'rootf'), inp = h('input');
    inp.type = 'text';
    inp.spellcheck = false;
    inp.setAttribute('aria-label', 'Root folder');
    var browse = btn('', null, function() {
      Promise.resolve(api.rootBrowse(inp.value)).then(function(b) {
        if (seq !== drawSeq) return;
        if (b.line) { say(b.line, true); return; }
        if (!b.picked) return;
        inp.value = b.path;
        check();
      }, function(e) { if (seq === drawSeq) say('The folder picker did not open: ' + (e && e.message ? e.message : String(e)), true); });
    });
    browse.appendChild(icon('folder'));
    browse.appendChild(h('span', null, 'Browse'));
    var save = btn('primary', 'Save', function() {
      save.disabled = true;
      Promise.resolve(api.rootSet(inp.value)).then(function(rv) {
        rootSaved = 'Saved. Every page now reads ' + rv.root + '. ' + rv.check.line;
        hist = [];
        return loadState();
      }, function(e) {
        if (seq !== drawSeq) return;
        say('Not saved: ' + (e && e.message ? e.message : String(e)), true);
        save.disabled = false;
      });
    });
    save.disabled = true;
    f.appendChild(inp);
    f.appendChild(browse);
    f.appendChild(save);
    r.appendChild(f);
    pane.appendChild(r);
    var line = h('p', 'rootline', 'Reading the root.');
    pane.appendChild(line);
    function say(text, warn) {
      line.textContent = text;
      line.className = 'rootline' + (warn ? ' warn' : '');
    }
    function show(c) {
      say(c.line, !c.ok);
      save.disabled = !c.ok || c.path === cur;
    }
    function check() {
      var k = ++n;
      Promise.resolve(api.rootCheck(inp.value)).then(function(c) {
        if (k === n && seq === drawSeq) show(c);
      });
    }
    inp.addEventListener('input', function() {
      save.disabled = true;
      clearTimeout(timer);
      timer = setTimeout(check, 250);
    });
    inp.addEventListener('keydown', function(ev) { if (ev.key === 'Enter' && !save.disabled) save.click(); });
    Promise.resolve(api.root()).then(function(rv) {
      if (seq !== drawSeq) return;
      cur = rv.root;
      inp.value = rv.root;
      if (rv.by_flag) {
        inp.readOnly = true;
        browse.hidden = true;
        save.hidden = true;
        say('Set by --root. Start the Control Centre without --root to change it here. ' + rv.check.line, false);
        return;
      }
      if (rootSaved) { say(rootSaved, false); rootSaved = ''; return; }
      show(rv.check);
    }, function(e) { if (seq === drawSeq) say('Could not read the root: ' + (e && e.message ? e.message : String(e)), true); });
  }

  // drawAtts: the picked files, each with a remove button; a long name is cut with hover text.
  function drawAtts() {
    attsEl.textContent = '';
    pend.forEach(function(f, i) {
      var a = h('span', 'att');
      if (f.url) {
        var im = h('img');
        im.src = f.url;
        im.alt = '';
        a.appendChild(im);
      }
      a.appendChild(h('span', null, f.name));
      var x = btn('', String.fromCharCode(215), function() {
        if (f.url) URL.revokeObjectURL(f.url);
        pend.splice(i, 1);
        drawAtts();
      });
      x.setAttribute('aria-label', 'Remove ' + f.name);
      a.appendChild(x);
      attsEl.appendChild(a);
    });
  }

  // addFiles keeps the page limits (MAX_ATT files, MAX_ATT_BYTES each) and says what it left out.
  function addFiles(list) {
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var f = list[i], name = f.name || 'screenshot.png';
      if (pend.length >= MAX_ATT) { out.push('At most ' + MAX_ATT + ' files per comment.'); break; }
      if (f.size > MAX_ATT_BYTES) { out.push(name + ' is larger than 10 MB.'); continue; }
      pend.push({name: name, file: f, url: /^image\//.test(f.type || '') ? URL.createObjectURL(f) : ''});
    }
    popmsg.textContent = out.join(' ');
    drawAtts();
  }

  // openPop opens the popup for the current target only.
  function openPop() {
    if (!target.kind) return;
    popTarget = target;
    document.getElementById('poph').textContent = 'Comment on ' + target.label;
    popmsg.textContent = '';
    sendb.disabled = false;
    pop.hidden = false;
    cmt.focus();
  }

  function closePop() {
    pop.hidden = true;
    cmt.value = '';
    pend.forEach(function(f) { if (f.url) URL.revokeObjectURL(f.url); });
    pend = [];
    popTarget = null;
    popmsg.textContent = '';
    drawAtts();
  }

  // readData: a file's bytes as base64, without the data:...;base64, prefix.
  function readData(f) {
    return new Promise(function(ok, bad) {
      var r = new FileReader();
      r.onload = function() {
        var s = String(r.result);
        ok(s.slice(s.indexOf(',') + 1));
      };
      r.onerror = function() { bad(r.error); };
      r.readAsDataURL(f);
    });
  }

  // sendComment writes one record through api.comment and shows its path in #res, the foot of the
  // detail pane, which never falls below the fold (detail() clears it).
  function sendComment() {
    var text = cmt.value, t = popTarget, files = pend.slice();
    if (!text.trim()) { cmt.focus(); return; }
    if (!t) return;
    sendb.disabled = true;
    popmsg.textContent = '';
    Promise.all(files.map(function(f) { return readData(f.file); })).then(function(datas) {
      return api.comment({target: t, text: text,
        attachments: files.map(function(f, i) { return {name: f.name, data: datas[i]}; })});
    }).then(function(rv) {
      closePop();
      var box = h('div', 'dec');
      box.appendChild(h('p', null, 'Comment saved' + (files.length ? ' with ' + files.length + (files.length === 1 ? ' file.' : ' files.') : '.')));
      box.appendChild(h('span', 'src', 'Record ' + srcPath(rv.path)));
      res.textContent = '';
      res.appendChild(box);
    }, function(e) {
      var msg = 'Not saved: ' + (e && e.message ? e.message : String(e));
      sendb.disabled = false;
      popmsg.textContent = msg;
      res.textContent = '';
      res.appendChild(h('p', 'popmsg', msg));
    });
  }

  // popup wires the comment popup: file button, drop zone, paste of images, Escape and the backdrop.
  function popup() {
    openc.addEventListener('click', openPop);
    document.getElementById('cancel').addEventListener('click', closePop);
    sendb.addEventListener('click', sendComment);
    pop.addEventListener('click', function(e) { if (e.target === pop) closePop(); });
    pop.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePop(); });
    document.getElementById('pickf').addEventListener('click', function() { fileIn.click(); });
    fileIn.addEventListener('change', function() {
      addFiles(fileIn.files);
      fileIn.value = '';
    });
    pop.addEventListener('paste', function(e) {
      var fl = e.clipboardData && e.clipboardData.files;
      if (fl && fl.length) {
        e.preventDefault();
        addFiles(fl);
      }
    });
    // A file dropped anywhere but the open drop zone is refused, so the window never opens it in
    // place of the app page.
    document.addEventListener('dragover', function(e) {
      e.preventDefault();
      if (e.dataTransfer && (pop.hidden || !drop.contains(e.target))) e.dataTransfer.dropEffect = 'none';
    });
    document.addEventListener('drop', function(e) { e.preventDefault(); });
    drop.addEventListener('dragover', function(e) {
      e.preventDefault();
      if (!pop.hidden) drop.classList.add('over');
    });
    drop.addEventListener('dragleave', function() { drop.classList.remove('over'); });
    drop.addEventListener('drop', function(e) {
      e.preventDefault();
      drop.classList.remove('over');
      if (!pop.hidden && e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
    });
  }

  // pageAgents: every agent session of the BurnMon snapshot with its kind, in the Go side's order.
  // Without a current snapshot the Go side sends only its line, and the page offers nothing.
  function pageAgents() {
    var seq = drawSeq;
    rootDetail('');
    Promise.resolve(api.agents(rowsFit())).then(function(av) {
      if (seq !== drawSeq) return;
      lead.appendChild(h('span', 'ell', av.line));
      if (!av.available) return;
      var hd = h('div', 'rw hd');
      [['ID', 'c1'], ['Kind', 'c3'], ['Project', 'c2'], ['State', 'c3'], ['Waiting for', 'c5']].forEach(function(x) {
        hd.appendChild(h('span', x[1], x[0]));
      });
      pane.appendChild(hd);
      var list = av.agents, pages = av.pages, picked = null;
      list.forEach(function(r) { if (r.id === sub.sel) picked = r; });
      if (!list.length) pane.appendChild(h('p', 'muted', 'No agent session runs.'));
      else {
        var cur = Math.min(sub.page, pages.length - 1), span = pages[cur];
        list.slice(span.from, span.to).forEach(function(r) {
          var b = btn('rw' + (r.state === 'blocked' ? ' warn' : '') + (sub.sel === r.id ? ' sel' : ''), null, function() {
            rowSel(b);
            sub.sel = r.id;
            sub.agent = r;
            sub.note = null;
            agentDetail(r, null, true);
          });
          var c = h('span', 'c1');
          c.appendChild(h('span', 'chip', r.id));
          b.appendChild(c);
          b.appendChild(h('span', 'c3', r.kind));
          b.appendChild(h('span', 'c2', r.project));
          b.appendChild(h('span', 'c3', r.state));
          b.appendChild(h('span', 'c5', r.waiting_for));
          pane.appendChild(b);
        });
        pager(pages, cur, function(p) { sub.page = p; render(); });
      }
      // After a Stop the list is read again; a stopped agent keeps its result line but loses Stop.
      var lines = sub.note && sub.note.key === sub.sel ? sub.note.lines : null;
      if (picked) agentDetail(picked, lines, true);
      else if (sub.agent && sub.agent.id === sub.sel && lines) agentDetail(sub.agent, lines, false);
      else rootDetail('Select an agent to stop it.');
    }, function(e) { if (seq === drawSeq) fail('Could not read the agent list', e); });
  }

  // agentDetail: a session with Stop while it is listed and stoppable (background only);
  // lines are a past result.
  function agentDetail(r, lines, listed) {
    var canStop = r.stoppable && listed;
    var box = h('div', 'dec');
    (lines || []).forEach(function(x) { box.appendChild(h(x[1] === 'src' ? 'span' : 'p', x[1], x[0])); });
    var chips = [];
    if (r.state) chips.push([r.state, r.state === 'blocked' ? 'warn' : '']);
    if (r.waiting_for) chips.push(['waiting for ' + r.waiting_for, 'warn']);
    if (!listed) chips.push(['no longer listed', 'on']);
    detail({k: 'Agent / ' + (r.project || ''), t: r.id, chips: chips,
      d: canStop ? 'Stop shows the command first; Confirm runs it.'
        : listed ? 'Stop works on background agents only.' : 'This agent is not in the agent list now.',
      act: canStop ? [['Stop', function() { decide('stop', r); }, 'primary']] : [],
      out: box});
  }

  // pageGit: every repo below the root, one dense row each with its lane (Changes to Released), grouped
  // by unit, in the Go side's order (open repos first by the stage they stop at, published last). Overview
  // only: nothing here changes a repo. The reading runs in the background; while it runs the page asks
  // again every GIT_POLL_MS.
  function pageGit(refresh) {
    var seq = drawSeq;
    rootDetail('Select a repo to see it. Double-click opens its worktrees, branches, tags, remotes and pull requests.');
    lead.appendChild(h('span', 'ell', 'Reading the repos below the root.'));
    pane.appendChild(loadBar());
    function ask(again) {
      Promise.resolve(api.git({rows: gitRows(), refresh: !!again, stage: gitStage})).then(function(gv) {
        if (seq !== drawSeq) return;
        drawGit(gv);
        if (gv.loading) setTimeout(function() { if (seq === drawSeq) ask(false); }, GIT_POLL_MS);
      }, function(e) { if (seq === drawSeq) fail('Could not read the repos', e); });
    }
    ask(refresh === true);
  }

  // loadBar: an indeterminate bar for a reading that runs in the background.
  function loadBar() {
    var b = h('div', 'loadbar');
    b.setAttribute('role', 'progressbar');
    b.setAttribute('aria-label', 'Reading the repos');
    b.appendChild(h('i'));
    return b;
  }

  // gitRows: rows the Git page fits under its strip.
  function gitRows() {
    return Math.max(1, rowsFit() - 3);
  }

  function gitCell(cls, text, title) {
    var c = h('span', cls, text);
    if (title) {
      c.title = title;
      c.setAttribute('data-title', '1');
    }
    return c;
  }

  // gitAB: ahead and behind as "+1 -2", "none" without an upstream, "?" when git status did not run.
  function gitAB(r) {
    if (r.status_error) return '?';
    if (!r.upstream) return 'none';
    return '+' + r.ahead + ' -' + r.behind;
  }

  // laneEl: the six stages as one line of dots. A dot is done (filled), here now (ring), waiting (amber),
  // blocked (red), not reached (empty) or not read (dashed); its hover text names the stage and its note.
  function laneEl(lane, small) {
    var el = h('span', 'lane' + (small ? ' sm' : ''));
    (lane || []).forEach(function(st, i) {
      var d = h('span', 'dot ' + (st.state === 'todo' ? '' : st.state));
      d.title = LANE_STAGES[i] + ': ' + (st.note || st.state);
      d.setAttribute('data-title', '1');
      el.appendChild(d);
      if (i < lane.length - 1) el.appendChild(h('span', 'cn' + (st.state === 'done' && lane[i + 1].state === 'done' ? ' d' : '')));
    });
    return el;
  }

  // laneList: the lane of one repo, a row per stage with its note, the first stage that is not done marked.
  function laneList(lane) {
    var box = h('div', 'vlane'), cur = -1;
    lane.forEach(function(st, i) { if (cur < 0 && st.state !== 'done' && !(st.stage === 'Review' && st.state === 'off')) cur = i; });
    lane.forEach(function(st, i) {
      var row = h('div', 'vs' + (i === cur ? ' cur' : ''));
      row.appendChild(h('span', 'dot ' + (st.state === 'todo' ? '' : st.state)));
      row.appendChild(h('span', 'vn', st.stage));
      row.appendChild(gitCell('vt', st.note || st.state, st.note || st.state));
      box.appendChild(row);
    });
    return box;
  }

  // gitStrip: how many repos are open, and one count per stage they stop at. A click on a stage filters
  // the rows to the repos that stop there; a second click clears the filter.
  var LANE_WORDS = {Changes: 'files not saved', Saved: 'commits not shared', Shared: 'not online, or behind',
    Review: 'review not done', Merged: 'not merged', Released: 'not released'};
  function gitStrip(sm) {
    var strip = h('div', 'lstrip');
    var big = h('div', 'lbig');
    big.appendChild(h('b', sm.open ? '' : 'ok', sm.open ? sm.open + ' of ' + sm.total + ' repos open' : 'All ' + sm.total + ' repos published'));
    big.appendChild(h('span', null, sm.published + ' published'));
    big.title = 'A repo is published when every stage is done, here and on every other branch and worktree.';
    big.setAttribute('data-title', '1');
    strip.appendChild(big);
    LANE_STAGES.forEach(function(name) {
      var n = (sm.stages && sm.stages[name]) || 0;
      var b = btn('lst' + (n ? '' : ' zero'), null, function() {
        gitStage = gitStage === name ? '' : name;
        sub.page = 0;
        render();
      });
      b.setAttribute('aria-pressed', gitStage === name ? 'true' : 'false');
      b.title = name + ': ' + LANE_WORDS[name] + (gitStage === name ? '. Click to show every repo.' : '. Click to show only these repos.');
      b.appendChild(h('b', null, String(n)));
      b.appendChild(h('span', null, name));
      strip.appendChild(b);
    });
    return strip;
  }

  function drawGit(gv) {
    lead.textContent = '';
    pane.textContent = '';
    var rf = btn('lbtn', null, function() {
      drawSeq++;
      lead.textContent = '';
      pane.textContent = '';
      pageGit(true);
    });
    rf.appendChild(icon('refresh'));
    rf.appendChild(h('span', null, 'Refresh'));
    rf.title = 'Read every repo again' + (gv.prs_on ? ', pull requests too' : '');
    lead.appendChild(rf);
    var sm = gv.summary, n = gv.repos.length;
    var text = sm.total + (sm.total === 1 ? ' repo' : ' repos') + (sm.open ? ' open.' : ', all published.');
    if (gv.loading) text = gv.read_at ? text + ' Reading again.' : 'Reading the repos below the root.';
    [gv.line, gv.pr_line].forEach(function(x) { if (x) text += ' ' + x; });
    if (sm.open && !(gv.loading && !gv.read_at)) {
      lead.appendChild(h('b', null, String(sm.open)));
      text = NBSP + 'of ' + text;
    }
    lead.appendChild(h('span', 'ell', text));
    if (gv.loading) pane.appendChild(loadBar());
    if (gv.read_at) pane.appendChild(gitStrip(sm));
    var hd = h('div', 'rw hd');
    [['Repo', 'g1'], ['Branch', 'g2'], ['Changes to Released', 'glane'], ['Stops at', 'gst'], ['Last', 'gl']].forEach(function(x) {
      hd.appendChild(gitCell(x[1], x[0], x[2] || x[0]));
    });
    pane.appendChild(hd);
    if (!n) {
      if (gv.read_at) pane.appendChild(h('p', 'muted', gitStage ? 'No repo stops at ' + gitStage + '.' : 'No git repo below the root, to 4 levels down.'));
      return;
    }
    var cur = Math.min(sub.page, gv.pages.length - 1), span = gv.pages[cur], picked = null, last = null;
    gv.repos.slice(span.from, span.to).forEach(function(r) {
      if (r.unit !== last) {
        var uh = h('div', 'rw uh');
        uh.appendChild(h('span', 'ell', r.unit ? unitLabel(r.unit) : 'Outside any unit'));
        pane.appendChild(uh);
        last = r.unit;
      }
      var bad = !r.published && r.lane.some(function(st) { return st.state === 'bad'; });
      var pick = function() { rowSel(b); sub.sel = r.id; gitRowDetail(r); };
      var b = btn('rw' + (r.published ? '' : ' warn'), null, pick);
      b.setAttribute('data-repo', r.id);
      wireOpen(b, pick);
      var nm = gitCell('g1', r.name + (r.open_branches.length ? ' +' + r.open_branches.length : ''), r.id +
        (r.open_branches.length ? ', and ' + r.open_branches.map(function(o) { return o.name; }).join(', ') : ''));
      b.appendChild(nm);
      b.appendChild(h('span', 'g2', r.detached ? headWord(r) : r.branch));
      var ln = h('span', 'glane');
      ln.appendChild(laneEl(r.lane));
      b.appendChild(ln);
      var stop = r.published ? 'Published' : r.stops_at + (r.stops_note ? ': ' + r.stops_note : '');
      b.appendChild(gitCell('gst ' + (r.published ? '' : bad ? 'bad' : 'open'), stop, stop));
      b.appendChild(gitCell('gl', r.last_sha ? r.last_sha + ' ' + r.last_age : '',
        r.last_sha ? r.last_sha + ', ' + r.last_age + ' ago: ' + r.last_subject : 'No commit read'));
      pane.appendChild(b);
      if (sub.sel === r.id) picked = b;
    });
    pager(gv.pages, cur, function(p) { sub.page = p; render(); });
    if (picked) picked.click();
  }

  // headWord says what a detached HEAD is: "at tag <name>" for a clean checkout exactly at a tag (at_tag is
  // set by the scan), else "detached" (long form "detached HEAD").
  function headWord(x, long) {
    if (x.at_tag) return 'at tag ' + x.at_tag;
    return long ? 'detached HEAD' : 'detached';
  }

  // gitRowDetail: one repo in the detail pane: its lane with the notes, what to do next, the other open
  // branches and worktrees, and Open repo.
  function gitRowDetail(r) {
    var chips = r.attention.map(function(a) { return [a, 'warn']; });
    if (!r.upstream && !r.status_error) chips.push(['no upstream', '']);
    var list = ['Branch ' + (r.detached ? headWord(r, true) : r.branch || 'not read') + (r.upstream ? ', upstream ' + r.upstream + ' ' + gitAB(r) : '')];
    if (!r.status_error) list.push(r.dirty + (r.dirty === 1 ? ' changed file' : ' changed files') + ', ahead and behind ' + gitAB(r) + '.');
    if (r.last_sha) list.push('Last commit ' + r.last_sha + ', ' + r.last_age + ' ago: ' + r.last_subject);
    if (r.status_error) list.push('Dirty and ahead/behind unknown: ' + r.status_error);
    list.push(r.stashes + (r.stashes === 1 ? ' stash entry, ' : ' stash entries, ') + r.worktrees + ' linked worktrees.');
    list.push(r.prs >= 0 ? r.prs + ' open pull requests.' : r.github ? 'Pull requests: switch them on in Settings.' : 'No GitHub remote.');
    var open = function() { go('gitrepo', r.id); };
    detail({k: 'Repo / ' + (r.unit ? unitLabel(r.unit) : 'no unit'), t: r.name, chips: chips, next: r.next, lane: r.lane,
      others: r.open_branches, list: list, act: [['Open repo \u203A', openSel, 'primary']], open: open, src: srcPath(r.id)});
  }

  // pageGitRepo: one repo's worktrees (with the agent sessions that work in each, matched by folder
  // name), local branches with merged or not, tags, remotes and pull requests. Each section shows what
  // fits; the rest is one "+N more" line whose hover lists it.
  function pageGitRepo(id) {
    var seq = drawSeq;
    lead.appendChild(h('span', 'ell', String(id) + ': reading the repo.'));
    pane.appendChild(loadBar());
    detail({k: 'Repo', t: String(id), src: srcPath(id)});
    function ask() {
      Promise.resolve(api.gitRepo(String(id))).then(function(v) {
        if (seq !== drawSeq) return;
        if (v.loading) { setTimeout(function() { if (seq === drawSeq) ask(); }, GIT_POLL_MS); return; }
        if (!v.found || !v.detail) {
          lead.textContent = '';
          lead.appendChild(h('span', 'ell', 'Repo ' + id + ' is not in the last reading. Go back to the Git page.'));
          return;
        }
        drawRepo(v.detail);
      }, function(e) { if (seq === drawSeq) fail('Could not read the repo ' + id, e); });
    }
    ask();
  }

  // gitSection draws a section title and at most n rows; when the list is longer, the last row is
  // "+N more" with the rest in its hover text.
  function gitSection(col, title, list, n, row, label, empty) {
    col.appendChild(h('span', 'eyebrow', title));
    if (!list.length) { col.appendChild(h('div', 'rw muted', empty)); return; }
    var fit = list.length > n ? Math.max(0, n - 1) : list.length;
    list.slice(0, fit).forEach(function(x) { col.appendChild(row(x)); });
    if (fit < list.length) {
      var more = h('div', 'rw muted', '+' + (list.length - fit) + ' more');
      more.title = list.slice(fit).map(label).join('; ');
      more.setAttribute('data-title', '1');
      col.appendChild(more);
    }
  }

  function drawRepo(d) {
    var r = d.repo;
    pane.textContent = '';
    lead.textContent = '';
    lead.appendChild(h('span', 'ell', r.name + ', ' + (r.detached ? headWord(r, true) : 'on ' + r.branch) + '. ' +
      d.worktrees.length + (d.worktrees.length === 1 ? ' worktree, ' : ' worktrees, ') + d.branches.length + ' branches, ' +
      d.tags.length + ' tags. Overview only: nothing here changes the repo.'));
    gitRowDetail(r);
    var cols = h('div', 'cols'), left = h('div', 'col'), right = h('div', 'col');
    // rows per column: pane height less padding and the section titles (about 24 px each)
    var lrows = Math.max(4, Math.floor((pane.clientHeight - 24 - 2 * 24) / ROW_H));
    var rrows = Math.max(6, Math.floor((pane.clientHeight - 24 - 3 * 24) / ROW_H));
    var wtN = Math.min(d.worktrees.length || 1, Math.max(2, Math.floor(lrows * 0.45)));
    gitSection(left, 'Worktrees, sessions matched by folder name', d.worktrees, wtN, function(w) {
      var pick = function() {
        rowSel(b);
        detail({k: w.main ? 'Main worktree' : 'Linked worktree', t: w.name,
          chips: w.missing ? [['folder gone', 'warn']] : w.dirty ? [[w.dirty + ' dirty', 'warn']] : [],
          list: ['Branch ' + (w.detached ? headWord(w, true) : w.branch)].concat(
            w.sessions.length ? ['Sessions here (by folder name): ' + w.sessions.join(', ')] : ['No agent session works here now.'],
            w.status_error ? ['Dirty unknown: ' + w.status_error] : []),
          src: w.path});
      };
      var b = btn('rw' + (w.dirty || w.missing ? ' warn' : ''), null, pick);
      b.appendChild(gitCell('g1', w.name, w.path));
      b.appendChild(h('span', 'g2', w.detached ? headWord(w) : w.branch));
      var wl = h('span', 'glane sm');
      wl.appendChild(laneEl(w.lane, true));
      b.appendChild(wl);
      b.appendChild(h('span', 'gn' + (w.dirty ? ' warn' : ''), w.missing ? 'gone' : w.status_error ? '?' : w.dirty ? String(w.dirty) : ''));
      b.appendChild(gitCell('g2', w.sessions.join(', '), w.sessions.length ? w.sessions.join(', ') : ''));
      return b;
    }, function(w) { return w.name; }, 'No worktree read.');
    gitSection(left, 'Local branches', d.branches, Math.max(1, lrows - wtN), function(br) {
      var c = h('div', 'rw');
      c.appendChild(gitCell('g1', br.name + (br.current ? ' (current)' : ''), br.name));
      var bl = h('span', 'glane sm');
      bl.appendChild(laneEl(br.lane, true));
      c.appendChild(bl);
      c.appendChild(h('span', 'gl', br.merged));
      return c;
    }, function(br) { return br.name + ' ' + br.merged; }, 'No local branch.');
    var prN = Math.max(2, Math.floor(rrows * 0.4)), tagN = Math.max(2, Math.floor((rrows - prN) / 2)), remN = Math.max(1, rrows - prN - tagN);
    var prEmpty = d.pr_line || (r.prs < 0 ? (r.github ? 'Switch on GitHub pull requests in Settings to see them.' : 'No GitHub remote.') : 'No open pull request.');
    gitSection(right, 'Pull requests', d.prs, prN, function(p) {
      var c = h('div', 'rw' + (p.checks === 'fail' ? ' warn' : ''));
      c.appendChild(h('span', 'gn', '#' + p.number));
      c.appendChild(gitCell('g1', p.title, p.title));
      c.appendChild(gitCell('g2', p.branch, p.branch));
      c.appendChild(h('span', 'gl', [p.draft ? 'draft' : '', p.checks, (p.review || '').toLowerCase().replace(/_/g, ' ')].filter(Boolean).join(', ')));
      return c;
    }, function(p) { return '#' + p.number + ' ' + p.title; }, prEmpty);
    gitSection(right, 'Tags, newest first', d.tags, tagN, function(t) {
      var c = h('div', 'rw');
      c.appendChild(gitCell('g1', t, t));
      return c;
    }, function(t) { return t; }, 'No tags.');
    gitSection(right, 'Remotes', d.remotes, remN, function(m) {
      var c = h('div', 'rw');
      c.appendChild(h('span', 'gl', m.name));
      c.appendChild(gitCell('g2', m.url, m.url));
      return c;
    }, function(m) { return m.name + ' ' + m.url; }, 'No remotes.');
    cols.appendChild(left);
    cols.appendChild(right);
    pane.appendChild(cols);
  }

  function hoverTitle(e) {
    var el = e.target.closest && e.target.closest(HOVER_SEL);
    // A title the page set itself (data-title) stays as it is.
    if (!el || el.hasAttribute('data-title')) return;
    if (el.scrollWidth > el.clientWidth) el.title = el.textContent;
    else el.removeAttribute('title');
  }

  function start() {
    app.addEventListener('mouseover', hoverTitle);
    popup();
    backButton();
    // The mouse back button: mousedown only stops the default, mouseup runs back() once per press.
    window.addEventListener('mousedown', function(ev) {
      if (ev.button !== 3) return;
      ev.preventDefault();
    });
    window.addEventListener('mouseup', function(ev) {
      if (ev.button === 3) { ev.preventDefault(); back(); }
    });
    document.addEventListener('keydown', function(ev) {
      if (ev.altKey && ev.key === 'ArrowLeft') { ev.preventDefault(); back(); }
    });
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(loadState, 200);
    });
    panelEdge();
    render();
    // The shell is drawn here; the first state can take a while on a big folder, so say what is running.
    lead.textContent = 'Reading the folder.';
    Promise.resolve(api.settingsGet()).then(function(s) {
      applySettings(s);
      return loadState();
    }, function(e) { fail('Could not read the settings', e); });
  }

  start();
})();
</script>
</body>
</html>
